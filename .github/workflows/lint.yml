name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash:
    name: ShellCheck and shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - name: Collect Bash files
        id: files
        shell: bash
        run: |
          git ls-files -z '*.sh' '*.bash' '*.bats' > bash-files.txt
          if [ -s bash-files.txt ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: ShellCheck
        if: steps.files.outputs.found == 'true'
        run: xargs -0 shellcheck --external-sources < bash-files.txt
      - name: shfmt
        if: steps.files.outputs.found == 'true'
        run: xargs -0 shfmt -d < bash-files.txt
      - name: No Bash files yet
        if: steps.files.outputs.found != 'true'
        run: echo "No Bash files yet; skipping."

  powershell:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Analyze
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.ps1, *.psm1 -File |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          if (-not $files) { Write-Output 'No PowerShell files yet; skipping.'; exit 0 }
          $results = $files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1
          }
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -in 'Error', 'Warning') { exit 1 }

  python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          git ls-files -z '*.json' | xargs -0 -n1 python3 -c 'import json,sys; json.load(open(sys.argv[1]))'
      - name: Reject CRLF in LF-only files
        run: |
          if git ls-files -z '*.sh' '*.ps1' '*.py' '*.md' '*.yml' | xargs -0 grep -l $'\r'; then
            echo "CRLF found in files that must use LF"; exit 1
          fi
