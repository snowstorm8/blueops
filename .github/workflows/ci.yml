name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Baseline diff smoke test (offline CLI)
        shell: bash
        run: |
          set +e
          python -m shared.reporting.diff tests/fixtures/baseline/linux-baseline.json tests/fixtures/baseline/linux-current.json --json --quiet --generated-at 2026-01-02T12:00:00Z > /dev/null
          code=$?
          test "$code" -eq 4 || { echo "expected exit 4, got $code"; exit 1; }

  bash:
    name: Bash tests (Bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run Bats tests
        run: bats --recursive tests/linux

  powershell:
    name: PowerShell tests (Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester tests (audit runs in Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/windows'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Run Pester tests (audit runs in PowerShell 7)
        shell: pwsh
        env:
          BO_TEST_SHELL: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/windows'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config
