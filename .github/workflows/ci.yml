name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.runner || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
        include:
          # setup-python has no Python 3.9 build for the Ubuntu 26.04 image behind
          # ubuntu-latest; pin only this combination (the job name stays unchanged).
          - os: ubuntu-latest
            python: "3.9"
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Baseline diff smoke test (offline CLI)
        shell: bash
        run: |
          set +e
          python -m shared.reporting.diff tests/fixtures/baseline/linux-baseline.json tests/fixtures/baseline/linux-current.json --json --quiet --generated-at 2026-01-02T12:00:00Z > /dev/null
          code=$?
          test "$code" -eq 4 || { echo "expected exit 4, got $code"; exit 1; }
      - name: Detection smoke test (offline CLI)
        shell: bash
        run: |
          set +e
          for host in linux windows; do
            python -m shared.reporting.detect tests/fixtures/baseline-e2e/$host/baseline.json tests/fixtures/baseline-e2e/$host/changed.json --json --quiet --generated-at 2026-03-02T00:00:00Z > /dev/null
            code=$?
            test "$code" -eq 4 || { echo "$host: expected exit 4, got $code"; exit 1; }
            python -m shared.reporting.detect tests/fixtures/baseline-e2e/$host/baseline.json tests/fixtures/baseline-e2e/$host/identical.json --json --quiet --generated-at 2026-03-02T00:00:00Z > /dev/null
            code=$?
            test "$code" -eq 0 || { echo "$host: expected exit 0, got $code"; exit 1; }
          done
          python -m shared.reporting.detect tests/fixtures/baseline-e2e/linux/baseline.json tests/fixtures/baseline-e2e/linux/changed.json --accepted examples/accepted-changes.example.json --json --quiet --generated-at 2026-03-02T00:00:00Z > allow.json
          code=$?
          test "$code" -eq 4 || { echo "allowlist: expected exit 4, got $code"; exit 1; }
          python -c "import json; d=json.load(open('allow.json')); s=d['summary']; assert s['accepted']==1 and s['total']==11 and d['allowlist']['entries'][0]['status']=='matched', s"
      - name: Assessment engine smoke test (plugin module, compare, reports, verify)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          work="$(mktemp -d)"
          cp -R examples/plugins "$work/plugins"
          chmod 755 "$work/plugins" && chmod 644 "$work"/plugins/*
          python -m shared.engine list --platform linux --plugin-dir "$work/plugins" | grep -q linux.sudoers-nopasswd
          for n in 1 2; do
            set +e
            python -m shared.engine run --platform linux --plugin-dir "$work/plugins" --modules linux.sudoers-nopasswd --output-dir "$work/out$n" --quiet
            code=$?
            set -e
            # 6 is expected for an unprivileged runner: /etc/sudoers is unreadable, which the plugin reports
            test "$code" -eq 0 -o "$code" -eq 4 -o "$code" -eq 6 || { echo "engine run exited $code"; exit 1; }
          done
          a="$(ls -d "$work"/out1/blueops-assessment-*)"; b="$(ls -d "$work"/out2/blueops-assessment-*)"
          python -m shared.engine verify "$b"
          python -m shared.engine validate "$b/assessment.json"
          python -m shared.engine report "$b" --compare "$a" --format html --output "$work/r.html"
          grep -q "Content-Security-Policy" "$work/r.html"
      - name: Detection engine smoke test (rule validation, embedded examples, detection run)
        shell: bash
        run: |
          set -e
          python -m shared.engine rules validate --examples
          python -m shared.engine rules test
          set +e
          python -m shared.engine detect run tests/fixtures/rules/linux-compromised.assessment.json --quiet > detections.json
          code=$?
          test "$code" -eq 4 || { echo "expected exit 4 for the compromised fixture, got $code"; exit 1; }
          python -m shared.engine detect run tests/fixtures/rules/linux-compromised.assessment.json --quiet --fail-on critical --min-severity critical > /dev/null
          python -m shared.engine validate detections.json
      - name: Telemetry smoke test (offline import, hunt, report)
        shell: bash
        run: |
          set -e
          work="$(mktemp -d)"
          python -m shared.engine telemetry import examples/telemetry/web01-compromised.jsonl --output-dir "$work/store" --quiet
          store="$(ls -d "$work"/store/blueops-telemetry-*)"
          python -m shared.engine telemetry show "$store" > /dev/null
          set +e
          python -m shared.engine telemetry hunt "$store" --quiet > "$work/hunt.json"
          code=$?
          test "$code" -eq 4 || { echo "expected exit 4 for the compromised example, got $code"; exit 1; }
          set -e
          python -m shared.engine validate "$work/hunt.json"
          python -m shared.engine telemetry report "$store" --detections "$work/hunt.json" --format html --output "$work/r.html"
          grep -q "Content-Security-Policy" "$work/r.html"
      - name: Live telemetry collection on this runner (real OS interfaces)
        shell: bash
        run: |
          set +e
          work="$(mktemp -d)"
          python -m shared.engine telemetry collect --output-dir "$work" --since-hours 1 --max-events 200
          code=$?
          # 0 complete, 6 collected with declared gaps (an unprivileged runner cannot read everything)
          test "$code" -eq 0 -o "$code" -eq 6 || { echo "telemetry collect exited $code"; exit 1; }
          store="$(ls -d "$work"/blueops-telemetry-*)"
          python -m shared.engine telemetry hunt "$store" --quiet --fail-on critical > /dev/null
          code=$?
          test "$code" -eq 0 -o "$code" -eq 4 -o "$code" -eq 6 || { echo "telemetry hunt exited $code"; exit 1; }
      - name: Run-manifest smoke test (offline collector + verifier)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          out="$(mktemp -d)"
          export BO_TEST_MODE=1 BO_ROOT="$PWD/tests/fixtures/linux-root" BO_FORCE_MISSING_TOOLS="ip route ifconfig netstat systemd-detect-virt"
          PATH="$PWD/tests/fixtures/linux-bin:$PATH" bash linux/audit/audit-linux.sh --modules system --output-dir "$out" --quiet > /dev/null 2>&1
          run_dir="$(ls -d "$out"/blueops-run-* | head -n 1)"
          python -m shared.reporting.verify "$run_dir" || { echo "a fresh run directory did not verify"; exit 1; }
          echo tampered >> "$run_dir/run.log"
          python -m shared.reporting.verify "$run_dir" --quiet 2> /dev/null
          code=$?
          test "$code" -eq 3 || { echo "tampering was not detected (exit $code)"; exit 1; }

  bash:
    name: Bash tests (Bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run Bats tests
        run: bats --recursive tests/linux

  powershell:
    name: PowerShell tests (Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester tests (audit runs in Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/windows'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Run Pester tests (audit runs in PowerShell 7)
        shell: pwsh
        env:
          BO_TEST_SHELL: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/windows'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config
