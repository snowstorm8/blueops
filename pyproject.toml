# Tool configuration only; BlueOps is not (yet) a packaged distribution.

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S108"] # synthetic fixtures name /tmp paths and 0.0.0.0 on purpose
# The HTML renderer is mostly inline markup/CSS in string literals; wrapping them mid-tag would hurt
# readability and change nothing about the output.
"shared/reporting/render_html.py" = ["E501"]
"tests/shared/test_engine_examples.py" = ["E501"]
"shared/reporting/render_detections.py" = ["E501"]
# Rule validation/compilation passes diagnostics through recursive visitors (many parameters) and
# builds messages inline; wrapping them would not make them clearer.
"shared/rules/**" = ["PLR0913", "PLR0917", "E501"]
# Telemetry normalization/ingestion are single linear validation passes over record dicts.
"shared/telemetry/**" = ["PLR0913", "PLR0917", "E501"]
"tests/shared/telemetry_support.py" = ["PLR0913", "PLR0917", "E501"]
# Runs the repository's own collector script (a fixed path) against synthetic roots.
"tests/shared/test_telemetry_linux.py" = ["S603", "E501"]
"tests/shared/telemetry_linux_support.py" = ["E501", "PLR0913", "PLR0917"]
"tests/shared/test_telemetry_windows.py" = ["S603", "E501", "PLR0913", "PLR0917", "PLC0415"]
"tests/shared/test_telemetry_live.py" = ["S603", "E501"]
# Validation framework: dense data tables and single linear classification passes.
"shared/validation/**" = ["PLR0913", "PLR0917", "E501"]
"tests/shared/validation_support.py" = ["PLR0913", "PLR0917", "E501"]
"tests/shared/test_validation_*.py" = ["E501", "PLC0415", "S603", "PLR0913", "PLR0917"]
"tests/shared/test_telemetry_*.py" = ["E501", "PLC0415"]
# Detection tests are dense data tables (rules, hosts, expectations); wrapping them hides the shape.
"tests/shared/test_rules_*.py" = ["E501", "PLC0415", "S311"]
"tests/shared/rules_support.py" = ["E501"]
"tests/shared/test_repo_hygiene.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/shared"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
